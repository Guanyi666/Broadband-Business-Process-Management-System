version: '3.8'

# BBPMS Simplified Infrastructure — Modular Monolith
# Only MySQL + Redis. Backend runs from IDEA, frontends from WebStorm.

networks:
  bbpms-net:
    driver: bridge
    name: bbpms-net

volumes:
  mysql-data:
  redis-data:

services:
  mysql:
    image: mysql:8.0
    container_name: bbpms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=500
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./middleware/mysql/init:/docker-entrypoint-initdb.d
    networks: [bbpms-net]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  redis:
    image: redis:7-alpine
    container_name: bbpms-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports: ["6379:6379"]
    volumes:
      - redis-data:/data
      - ./middleware/redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks: [bbpms-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources: { limits: { cpus: '0.5', memory: 512M } }

